periods:{title:'Understanding your menstrual cycle',cat:'Menstrual Health',minutes:5,emoji:'🌸',intro:'The menstrual cycle is a repeating pattern of hormonal changes. Cycle length and symptoms vary across people and across months.',take:'Track the first day of each period and note meaningful changes. A pattern over multiple months can be useful when talking with a healthcare professional.',source:'https://www.who.int/vietnam/news/fact-sheets/detail/menstrual-health'},
cramps:{title:'Period pain: what is common?',cat:'Menstrual Health',minutes:4,emoji:'🌿',intro:'Period cramps can occur as the uterus contracts. Pain that is severe, worsening, or interrupts daily life deserves medical attention rather than being dismissed.',take:'Gentle movement or warmth may help some people. Seek medical advice when pain is persistent, unusually severe or disrupting activities.',source:'https://www.acog.org/womens-health/faqs/dysmenorrhea-painful-periods'},
heavy:{title:'Understanding heavy menstrual bleeding',cat:'Menstrual Health',minutes:5,emoji:'💗',intro:'Bleeding experiences vary, but needing to change menstrual products very frequently or bleeding that affects everyday life may be a reason to consult a healthcare professional.',take:'Tracking dates, duration and how often products must be changed can help explain symptoms during consultation.',source:'https://www.nhs.uk/conditions/periods/period-problems/'},
irregular:{title:'Irregular periods and cycle changes',cat:'Menstrual Health',minutes:4,emoji:'🌙',intro:'Cycles can vary naturally. Stress, illness, medication, hormonal contraception and other factors may affect bleeding patterns.',take:'A persistently changed cycle, significant symptoms or pregnancy concerns can warrant a clinical discussion.',source:'https://www.nhs.uk/conditions/periods/period-problems/'},
pms:{title:'PMS and emotional changes',cat:'Menstrual Health',minutes:5,emoji:'🫧',intro:'Some people notice recurring physical and emotional changes before menstruation. Experiences and intensity vary.',take:'A symptom diary can help identify patterns to discuss with a qualified professional if needed.',source:'https://www.nhs.uk/conditions/pre-menstrual-syndrome/'},
hygiene:{title:'A practical guide to period hygiene',cat:'Menstrual Health',minutes:4,emoji:'🪷',intro:'Pads, tampons, menstrual cups and period underwear can all be useful options when used and cleaned according to product guidance.',take:'Choose products that suit your comfort and access needs, and follow their safety and replacement instructions.',source:'https://www.who.int/vietnam/news/fact-sheets/detail/menstrual-health'},
ovulation:{title:'Ovulation, explained simply',cat:'Reproductive Health',minutes:5,emoji:'✨',intro:'Ovulation is the release of an egg from an ovary. Timing varies, including in people who usually have regular cycles.',take:'Calendar estimates are uncertain and must never be treated as reliable contraception or a fertility diagnosis.',source:'https://www.nhs.uk/conditions/periods/fertility-in-the-menstrual-cycle/'},
contraception:{title:'Contraception: getting informed',cat:'Reproductive Health',minutes:7,emoji:'🛡️',intro:'Contraception includes barrier, hormonal and long-acting methods. Different methods have different benefits and limitations.',take:'Speak with a qualified healthcare professional to identify options based on your circumstances and needs.',source:'https://www.who.int/news-room/fact-sheets/detail/family-planning-contraception'},
pcos:{title:'Understanding PCOS',cat:'Reproductive Health',minutes:6,emoji:'🌷',intro:'Polycystic ovary syndrome is a hormonal condition that can involve irregular cycles and other symptoms; diagnosis requires appropriate medical assessment.',take:'Tracking cycles and symptoms can support an informed consultation but does not establish a diagnosis.',source:'https://www.who.int/news-room/fact-sheets/detail/polycystic-ovary-syndrome'},
endo:{title:'What is endometriosis?',cat:'Reproductive Health',minutes:6,emoji:'🪻',intro:'Endometriosis is a condition in which tissue similar to the uterine lining grows outside the uterus. Symptoms may include painful menstruation and pelvic pain.',take:'Speak with a qualified clinician if pain is significant, worsening, or affecting daily activities.',source:'https://www.who.int/news-room/fact-sheets/detail/endometriosis'},
missed:{title:'Missed periods: possible explanations',cat:'Reproductive Health',minutes:5,emoji:'🍃',intro:'Periods may be delayed for different reasons, including pregnancy, stress, illness and other hormonal or health factors.',take:'If pregnancy is possible, use an appropriate pregnancy test. Seek professional assessment for ongoing missed periods or associated symptoms.',source:'https://www.nhs.uk/conditions/stopped-or-missed-periods/'},
mental:{title:'Stress and menstrual well-being',cat:'Mental Well-being',minutes:5,emoji:'☁️',intro:'Stress can affect well-being and may coincide with menstrual changes. The cause of an individual cycle change cannot be determined from an app.',take:'Notice your patterns and seek support when distress affects daily functioning.',source:'https://www.who.int/news-room/fact-sheets/detail/mental-health-strengthening-our-response'},
sleep:{title:'Sleep, rest and energy',cat:'Nutrition & Lifestyle',minutes:4,emoji:'🌜',intro:'Adequate sleep contributes to overall well-being. Some people experience sleep changes around their cycle or during menopause.',take:'Consistent routines and discussing persistent sleep problems with a clinician can be helpful.',source:'https://www.nhs.uk/conditions/menopause-and-perimenopause/symptoms/'},
iron:{title:'Iron and menstrual health',cat:'Nutrition & Lifestyle',minutes:5,emoji:'🥬',intro:'Heavy menstrual bleeding can contribute to iron deficiency. Foods containing iron are one part of a balanced eating pattern.',take:'Persistent tiredness or heavy bleeding may warrant professional evaluation; food choices alone may not address an underlying cause.',source:'https://www.nhs.uk/conditions/periods/period-problems/'},
activity:{title:'Movement and everyday well-being',cat:'Nutrition & Lifestyle',minutes:4,emoji:'🌻',intro:'Movement can support general physical and emotional well-being. Activities should be adjusted for comfort and any health needs.',take:'Choose activities you enjoy and seek personalised professional advice for limitations or ongoing symptoms.',source:'https://www.who.int/news-room/fact-sheets/detail/physical-activity'},
menopause:{title:'Perimenopause and menopause basics',cat:'Menopause',minutes:6,emoji:'🌺',intro:'Perimenopause is the transition towards menopause. Changes can include cycle irregularity, hot flushes, sleep changes and mood symptoms.',take:'Symptoms vary widely; menopause support should adapt to your life stage, not assume every person needs cycle predictions.',source:'https://www.nhs.uk/conditions/menopause-and-perimenopause/symptoms/'},
postmenopause:{title:'Bleeding after menopause',cat:'Menopause',minutes:4,emoji:'🩷',intro:'Bleeding after menopause is not considered a typical period and should be assessed by a medical professional, even when light.',take:'Arrange a clinical assessment if you experience bleeding after menopause.',source:'https://www.nhs.uk/symptoms/post-menopausal-bleeding/'},
bone:{title:'Bone health after menopause',cat:'Menopause',minutes:5,emoji:'🌱',intro:'Bone health becomes an important topic across later life. Nutrition, movement and preventive healthcare can all be part of supportive care.',take:'Discuss appropriate screenings and individual risk factors with a healthcare professional.',source:'https://www.nhs.uk/conditions/menopause-and-perimenopause/'},
partner:{title:'How to support someone on their period',cat:'Partner & Family',minutes:5,emoji:'🤝',intro:'The best support starts with listening. People experience symptoms differently, so ask what would actually be useful.',take:'Respect personal boundaries, offer practical support and avoid dismissing pain or emotional experiences.',source:'https://www.who.int/vietnam/news/fact-sheets/detail/menstrual-health'},

function historyBars(){let info=periodInfo(),p=[...state.periods].sort((a,b)=>a.start.localeCompare(b.start));let arr=p.slice(-6).map((x,i)=>({lab:parse(x.start).toLocaleString('en-IN',{month:'short'}),val:i?diff(x.start,p[p.indexOf(x)-1]?.start||x.start):null}));let max=Math.max(40,...arr.map(x=>x.val||0));return `<div class="chart-bars">${arr.map((x,i)=>`<div class="bar-column"><span class="tiny">${x.val||'—'}</span><div class="bar ${i%2?'rose':''}" style="height:${x.val?x.val/max*110:8}px"></div><small>${x.lab}</small></div>`).join('')}</div><p class="tiny muted" style="margin-top:14px">Cycle length between successive logged starts; first point has no prior comparison.</p>`}
function symptomBars(){let counts={};state.symptoms.forEach(x=>{counts[x.name]=(counts[x.name]||0)+1});let arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);if(!arr.length)return `<p class="muted small">Log symptoms to build your personalised overview.</p>`;let max=Math.max(...arr.map(x=>x[1]));return `<div class="chart-bars">${arr.map(([lab,val],i)=>`<div class="bar-column"><span class="tiny">${val}</span><div class="bar ${i%2?'rose':''}" style="height:${Math.round(val/max*115)}px"></div><small style="text-align:center">${esc(lab)}</small></div>`).join('')}</div>`}
function home(){let feat=[['calendar','Track your cycle','A gentle, interactive calendar to understand patterns and changes.','cycle'],['activity','Understand symptoms','See personal trends and find helpful, responsible guidance.','symptoms'],['book','Learn with clarity','Browse accessible articles with credible references.','library'],['heart','Find care that fits','Explore specialist categories and prepare for consultations.','care'],['users','Support each other','Learn how partners and families can show up meaningfully.','partner'],['hand','Make a difference','Explore accessible-healthcare causes and our social mission.','impact']];return `<main><section class="hero"><div><span class="tag">${ic('sparkle')} WOMEN'S HEALTH, REIMAGINED</span><h1>Your health.<br>Your journey.<br><em>Your choice.</em></h1><p>A kinder place to track your cycle, understand symptoms, discover trusted information and find the support you deserve — all in one connected experience.</p><div class="hero-ctas">${linkbtn('Explore my dashboard '+ic('arrow'),'dashboard')}${linkbtn('Discover our mission','about','outline')}</div><div class="hero-proof"><span class="proof-dots"><i></i><i></i><i></i></span><span>Built around education, empathy and privacy</span></div></div><div class="hero-art"><div class="glow"></div><span class="hero-spark one">✦</span><span class="hero-spark two">✳</span><div class="floating hero-card-main"><div class="hero-top"><div><span class="tiny muted">YOUR WELLNESS SPACE</span><h4>October overview 🌸</h4></div><span class="tag peach">Cycle log</span></div><div class="hero-cal">${['S','M','T','W','T','F','S'].map(x=>`<span class="wk">${x}</span>`).join('')}${Array.from({length:28},(_,i)=>`<span class="${[6,7,8,9,10].includes(i)?'period':''} ${i===16?'chosen':''}">${i+1}</span>`).join('')}</div><p class="tiny muted" style="margin:15px 0 0">A clearer picture, one day at a time.</p></div><div class="floating hero-card-small"><div class="row"><span class="feature-icon" style="height:36px;width:36px;margin:0;font-size:17px">✿</span><div><strong style="font-size:12px">Check in with yourself</strong><div class="tiny muted">Mood & symptoms</div></div></div><div class="pills" style="margin-top:12px"><span class="pill">Calm ☁️</span><span class="pill">Tired 🌙</span></div></div><div class="floating hero-card-mini"><div class="tiny muted">Little steps, big impact</div><strong style="font-size:13px;display:block;margin:7px 0">Health knowledge</strong><div class="mini-progress"><i style="width:68%"></i></div><p class="tiny muted" style="margin:8px 0 0">Learn • Understand • Support</p></div></div></section><section class="section section-soft"><div class="container"><div class="section-head"><div class="eyebrow">ONE PLACE, MANY POSSIBILITIES</div><h2>Everything you need to feel more informed.</h2><p>From tracking and trustworthy learning to real conversations about care, our platform brings the pieces together.</p></div><div class="grid grid-3">${feat.map(([i,t,d,r],n)=>`<a class="feature" href="#/${r}"><div class="feature-icon ${['','rose','green','peach','rose','green'][n]}">${ic(i)}</div><h3>${t}</h3><p>${d}</p><span class="link">Explore feature ${ic('arrow')}</span></a>`).join('')}</div></div></section><section class="section"><div class="container"><div class="section-head"><div class="eyebrow">OUR APPROACH</div><h2>From uncertainty to understanding.</h2><p>Healthcare journeys shouldn't feel fragmented. We bring the next step within reach.</p></div><div class="journey">${[['calendar','Track','Record your experiences.'],['search','Understand','Explore plain-language information.'],['shield','Verify','Check sources and context.'],['activity','Recognise','Learn warning signs.'],['heart','Connect','Explore professional support.'],['users','Support','Learn and give back.']].map(([i,t,d])=>`<div class="journey-step"><div class="journey-circle">${ic(i)}</div><strong>${t}</strong><p>${d}</p></div>`).join('')}</div></div></section><section class="section section-cream"><div class="container"><div class="grid grid-2" style="align-items:center;gap:50px"><div><div class="eyebrow">HEALTHCARE ACROSS LIFE STAGES</div><h2>Because your needs change. And your support should, too.</h2><p>Whether you're learning about your first periods, navigating unpredictable cycles or seeking menopause support, choose the resources that fit your chapter.</p>${linkbtn('Explore life stages '+ic('arrow'),'life')}</div><div class="grid grid-2">${[['🌸','Menstrual years'],['🌿','Reproductive wellness'],['🪷','Perimenopause'],['☀️','Menopause & beyond']].map(([i,t])=>`<a href="#/life" class="feature" style="min-height:150px"><div class="feature-icon" style="font-size:23px">${i}</div><strong>${t}</strong></a>`).join('')}</div></div></div></section><section class="section"><div class="container"><div class="impact-cta"><div><span class="tag white">OUR SOCIAL MISSION</span><h2 style="margin:20px 0;color:white">Better health starts with better access.</h2><p>Learn, share, support. Standing Ovulation is designed around SDG 3 — Good Health and Well-being — and SDG 5 — Gender Equality.</p>${linkbtn('See our impact '+ic('arrow'),'impact','outline')}</div><div class="impact-orb">${ic('flower')}</div></div></div></section></main>`}
function dashboard(){let x=periodInfo(),menop=state.profile.stage.toLowerCase().includes('menopause')||state.profile.stage.toLowerCase().includes('post-');return `<main class="container page-stack">${titleBlock('YOUR PERSONALISED SPACE',`Hello, ${esc(state.profile.name)} <span style="color:#d8abc2">✿</span>`,`A gentle overview of your wellness journey. Everything here is stored on this device.`)}<div class="stats-grid">${stat('Logged cycles',state.periods.length,'Saved locally')}${stat('Symptom entries',state.symptoms.length,'Your personal history')}${stat('Saved articles',state.bookmarks.length,'For later reading')}${stat('Demo appointments',state.appointments.filter(x=>x.status!=='Cancelled').length,'No real booking made')}</div><div class="aside-layout"><div class="stack">${menop?`<div class="card"><div class="section-title-row"><h3>Your life-stage overview</h3><span class="pill">${esc(state.profile.stage)}</span></div><p>Your dashboard focuses on symptom patterns, healthy-living information and professional support — no cycle predictions required.</p><div class="form-actions">${linkbtn('Log a symptom','symptoms')}${linkbtn('Explore menopause resources','life','outline')}</div></div>`:`<div class="card"><div class="section-title-row"><h3>My cycle snapshot</h3><a class="link" href="#/cycle">Full tracker ${ic('arrow')}</a></div><div class="info-split"><div class="chart-ring" style="--percent:${x.length&&x.day?Math.min(100,Math.round(x.day/x.length*100)):0}%"><div><strong>${x.day||'—'}</strong><small>cycle day (estimate)</small></div></div><div><div class="eyebrow">YOUR LAST LOGGED PERIOD</div><h3 style="font-size:1.5rem">${nice(x.last)}</h3><p class="small">${x.next?`Next period estimated around <strong>${nice(x.next)}</strong>.`:'Add additional cycle entries to see an estimate.'} Predictions are approximate and not suitable for contraception.</p><div class="form-actions">${button(ic('plus')+' Log a period','primary','open-period')}${linkbtn('View calendar','cycle','outline')}</div></div></div></div>`}<div class="card"><div class="section-title-row"><h3>What have you been feeling?</h3><a href="#/symptoms" class="link">View all logs ${ic('arrow')}</a></div>${symptomBars()}<div class="form-actions">${button(ic('plus')+' Add symptom','soft','open-symptom')}</div></div><div class="card"><div class="section-title-row"><h3>A little learning for today</h3><a href="#/library" class="link">Health library ${ic('arrow')}</a></div><div class="grid grid-2">${['cramps','menopause'].map(k=>articleCard(k,true)).join('')}</div></div></div><aside class="stack"><div class="card">${calendar(ui.calMonth,true)}</div><div class="card"><div class="section-title-row"><h3>Quick actions</h3></div><div class="stack" style="gap:8px">${[['symptoms','activity','Log symptoms'],['care','heart','Find care'],['reports','file','Create health report'],['partner','users','Partner learning']].map(([r,i,t])=>`<a class="btn btn-outline" href="#/${r}" style="justify-content:start">${ic(i)} ${t} ${ic('arrow')}</a>`).join('')}</div></div><div class="notice green">${ic('shield')} Your health logs are private to this browser's demo storage. This prototype has no account server or automatic sharing.</div></aside></div></main>`}
function cycle(){let x=periodInfo();let p=[...state.periods].sort((a,b)=>b.start.localeCompare(a.start));return `<main class="container page-stack">${titleBlock('CYCLE JOURNAL','My cycle tracker','Log menstrual dates, explore your own patterns and keep a record you can discuss with a professional.',button(ic('plus')+' Log a period','primary','open-period'))}<div class="stats-grid">${stat('Last period',x.last?nice(x.last):'—','First logged day')}${stat('Average cycle',x.length?x.length+' days':'—','Based on available history')}${stat('Typical duration',x.duration?x.duration+' days':'—','Average logged duration')}${stat('Next estimate',x.next?nice(x.next):'—','Approximation only')}</div><div class="aside-layout"><div class="stack"><div class="card">${calendar(ui.calMonth)}</div><div class="card"><div class="section-title-row"><h3>Your cycle-length history</h3><span class="tag green">Your data</span></div>${historyBars()}</div></div><aside class="stack"><div class="notice warm">${ic('info')} Calendar predictions are uncertain, especially with irregular cycles, and cannot be used as contraception. This is not a fertility diagnosis.</div><div class="card"><h3>Estimates, not certainty</h3><p class="small">${x.ovulation?'Approximate ovulation: <strong>'+nice(x.ovulation)+'</strong>. The shaded fertile window is an estimate only.':'A cycle-based ovulation estimate is shown only after several reasonably consistent cycles have been logged.'}</p><p class="tiny muted">Even consistent cycles do not make calendar fertility predictions reliable for contraception.</p></div><div class="card"><div class="section-title-row"><h3>Previously logged</h3></div>${p.length?p.slice(0,7).map(v=>`<div class="list-row"><div class="feature-icon rose" style="height:34px;width:34px;font-size:17px;margin:0">🌸</div><div style="flex:1"><h4>${nice(v.start)}</h4><p>${diff(v.end,v.start)+1} days · ends ${nice(v.end)}${v.flow?' · '+esc(v.flow)+' flow':''}</p></div><button class="mini-link" data-action="delete-period" data-id="${v.id}" aria-label="Delete period">${ic('trash')}</button></div>`).join(''):'<p class="small">No entries yet.</p>'}</div></aside></div></main>`}
function symptoms(){let rows=[...state.symptoms].sort((a,b)=>b.date.localeCompare(a.date));return `<main class="container page-stack">${titleBlock('PERSONAL SYMPTOM JOURNAL','How have you been feeling?','Keep track of patterns over time — without reducing your experiences to a diagnosis.',button(ic('plus')+' Log symptom','primary','open-symptom'))}<div class="stats-grid">${stat('Total logs',rows.length,'Saved on this device')}${stat('Unique symptoms',new Set(rows.map(x=>x.name)).size,'Recorded categories')}${stat('Average intensity',rows.length?(rows.reduce((a,b)=>a+Number(b.severity),0)/rows.length).toFixed(1)+'/10':'—','Self-reported')}${stat('Last entry',rows.length?nice(rows[0].date):'—','Most recent record')}</div><div class="aside-layout"><div class="stack"><div class="card"><div class="section-title-row"><h3>Frequently logged symptoms</h3><span class="pill">Your records</span></div>${symptomBars()}</div><div class="card"><div class="section-title-row"><h3>Symptom journal</h3></div>${rows.length?rows.map(x=>`<div class="list-row"><div class="feature-icon rose" style="margin:0;width:44px;height:44px">${ic('activity')}</div><div style="flex:1"><div class="row" style="flex-wrap:wrap"><strong>${esc(x.name)}</strong><span class="pill">${esc(x.severity)}/10</span></div><p>${nice(x.date)} ${x.mood?'· Mood: '+esc(x.mood):''}</p>${x.notes?`<p style="margin-top:4px">${esc(x.notes)}</p>`:''}</div><button class="mini-link" data-action="delete-symptom" data-id="${x.id}" aria-label="Delete symptom">${ic('trash')}</button></div>`).join(''):'<div class="empty-state"><div class="feature-icon">🫧</div><h3>Your journal is ready</h3><p>Use the Log Symptom button to record your first entry.</p></div>'}</div></div><aside class="stack"><div class="focus-card"><div class="feature-icon">${ic('heart')}</div><h3>Patterns, not predictions.</h3><p class="small">Personal tracking can help you describe what you experience. It cannot tell you what caused a symptom.</p>${linkbtn('Understand symptoms','understand','outline')}</div><div class="card"><h3>Need a next step?</h3><p class="small">Learn which symptoms may deserve medical attention and explore professional categories.</p>${linkbtn('Find professional support','care','outline')}</div></aside></div></main>`}
function articleCard(id,compact=false){const a=A[id];return `<article class="card article-card" style="padding:${compact?'15':'17'}px"><div class="article-illustration" style="height:${compact?'68':'105'}px">${a.emoji}</div><div class="article-meta"><span>${esc(a.cat)}</span><span>${a.minutes} min read</span></div><h3 style="font-size:${compact?'13':'15'}px">${esc(a.title)}</h3>${!compact?`<p>${esc(a.intro)}</p>`:''}<div class="row between"><button class="mini-link" data-action="article" data-id="${id}">Read article ${ic('arrow')}</button><button class="mini-link ${state.bookmarks.includes(id)?'saved-badge':''}" data-action="bookmark" data-id="${id}" aria-label="Bookmark article">${state.bookmarks.includes(id)?'♥':'♡'}</button></div></article>`}
function libraryCards(){let ids=Object.keys(A).filter(k=>(ui.filter==='All'||A[k].cat===ui.filter)&&`${A[k].title} ${A[k].cat} ${A[k].intro}`.toLowerCase().includes(ui.search.toLowerCase()));return ids.length?`<div class="grid grid-3">${ids.map(k=>articleCard(k)).join('')}</div>`:'<div class="card empty-state"><h3>No matching articles</h3><p>Try another keyword or topic.</p></div>'}
function library(){let cats=['All',...new Set(Object.values(A).map(a=>a.cat))];return `<main class="container page-stack">${titleBlock('CREDIBLE HEALTH EDUCATION','The knowledge library','Clear, compassionate information about reproductive health, everyday well-being, and life beyond menstruation.')}<div class="notice" style="margin-bottom:22px">${ic('shield')} These are educational summaries with external source links. Prototype content is <strong>not independently medically reviewed</strong>.</div><div class="filters"><input id="library-search" class="input" placeholder="Search topics, symptoms, or questions..." value="${esc(ui.search)}" aria-label="Search articles"/><select id="library-category" class="select" aria-label="Article category">${cats.map(c=>`<option ${c===ui.filter?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="library-results">${libraryCards()}</div></main>`}
function understand(){let concerns=[['Pain and cramps','When persistent pain is important','cramps'],['Unusually heavy bleeding','What counts as heavy bleeding?','heavy'],['Irregular or missed periods','Common possible explanations','irregular'],['Mood and premenstrual changes','Understanding PMS','pms'],['Bleeding after menopause','When evaluation is important','postmenopause'],['Contraception and pregnancy concerns','Reliable information and next steps','contraception']];return `<main class="container page-stack">${titleBlock('UNDERSTAND MY SYMPTOMS','Questions deserve clarity.','Explore educational explanations and warning signs. This is not a diagnosis, triage service or medical assessment.') }<div class="notice warm" style="margin-bottom:22px"><strong>When not to wait:</strong> Seek urgent medical care for severe sudden pain, fainting, heavy bleeding with concerning symptoms, or other emergencies. Bleeding after menopause needs medical evaluation, even if light.</div><div class="grid grid-3">${concerns.map(([t,d,k])=>`<div class="feature"><div class="feature-icon rose">${ic('activity')}</div><h3>${t}</h3><p>${d}</p><button class="mini-link" data-action="article" data-id="${k}">Explore guide ${ic('arrow')}</button></div>`).join('')}</div><div class="card" style="margin-top:22px"><div class="grid grid-2" style="align-items:center"><div><h3>Want to prepare for a consultation?</h3><p class="small">Your logged cycles and symptoms can help you describe changes and ask more informed questions.</p></div><div class="form-actions">${linkbtn('Generate my report','reports')}${linkbtn('Find specialist categories','care','outline')}</div></div></div></main>`}
function nutrition(){return `<main class="container page-stack">${titleBlock('NUTRITION & LIFESTYLE','Everyday wellness, made gentler.','Evidence-aware education about nourishment, rest, movement and seeking tailored support.')}<div class="grid grid-3">${['iron','sleep','activity','mental','menopause','heavy'].map(k=>articleCard(k)).join('')}</div><div class="card" style="margin-top:22px"><div class="grid grid-2" style="align-items:center"><div><div class="eyebrow">PROFESSIONAL SUPPORT</div><h3>Need nutrition guidance for your situation?</h3><p class="small">Qualified professionals can help address individual concerns. Our educational library does not prescribe diets or treatment plans.</p></div><div>${linkbtn('Explore nutritionists','care')}</div></div></div></main>`}
function careCards(){let q=ui.careSearch.toLowerCase();let docs=DOCS.filter(x=>(ui.care==='All'||x.title===ui.care)&&([x.name,x.title,x.area,x.focus].join(' ').toLowerCase().includes(q)));if(ui.sort==='price')docs.sort((a,b)=>a.fees-b.fees);return docs.length?`<div class="grid grid-3">${docs.map(d=>`<article class="card doctor-card"><div class="row"><div class="doctor-avatar">${d.initials}</div><div><span class="tag peach" style="font-size:9px">FICTIONAL DEMO PROFILE</span><h3 style="margin:7px 0 3px">${d.name}</h3><div class="small muted">${d.title}</div></div></div><p>${d.focus}</p><div class="doctor-info"><span>${ic('pin')} ${d.area}, Mumbai</span><span>${ic('clock')} ${d.mode}</span></div><div class="row between"><strong>${currency(d.fees)} <small>/ demo visit</small></strong><button class="mini-link" data-action="save-doctor" data-id="${d.id}">${state.savedDoctors.includes(d.id)?'♥ Saved':'♡ Save'}</button></div><button class="btn btn-primary btn-mini" data-action="doctor" data-id="${d.id}">View profile & demo booking ${ic('arrow')}</button></article>`).join('')}</div>`:'<div class="empty-state card"><h3>No matching demo specialists</h3><p>Try another category or locality.</p></div>'}
function care(){return `<main class="container page-stack">${titleBlock('CONNECT TO APPROPRIATE CARE','Find support that fits you.','Explore professional categories, prepare for consultations and practise booking with fictional demo profiles.',linkbtn('My demo appointments','appointments','outline'))}<div class="notice warm" style="margin-bottom:22px"><strong>Demonstration directory:</strong> All profiles, names, qualifications, prices, locations and appointment slots on this page are fictional placeholders. No real provider is connected.</div><div class="filters"><input class="input" id="care-search" placeholder="Search name, locality, concern..." value="${esc(ui.careSearch)}" aria-label="Search specialists"/><select class="select" id="care-category">${['All','Gynaecologist','Therapist','Nutritionist'].map(x=>`<option ${x===ui.care?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="care-sort"><option value="">Sort: Default</option><option value="price" ${ui.sort==='price'?'selected':''}>Price: Low to high</option></select></div><div id="care-results">${careCards()}</div></main>`}
function appointments(){let data=[...state.appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<main class="container page-stack">${titleBlock('YOUR PREPARATION SPACE','My appointments','Keep demo appointment details and prepare questions to discuss with a qualified professional.',linkbtn('Explore specialists','care'))}<div class="notice" style="margin-bottom:20px">No real bookings are created here. All appointment entries are for the classroom demonstration.</div><div class="grid grid-2"> <div class="card"><h3>Your demo bookings</h3>${data.length?data.map(a=>`<div class="list-row"><div class="feature-icon" style="margin:0;height:40px;width:40px">${ic('calendar')}</div><div style="flex:1"><h4>${esc(a.name)} <span class="pill">${esc(a.status)}</span></h4><p>${nice(a.date)} · ${esc(a.time)} · ${esc(a.mode)}</p>${a.reason?`<p>${esc(a.reason)}</p>`:''}</div>${a.status!=='Cancelled'?`<button class="mini-link" data-action="cancel-appointment" data-id="${a.id}">Cancel</button>`:''}</div>`).join(''):'<div class="empty-state"><h3>No appointments yet</h3><p>Explore the directory and try a demonstration booking.</p></div>'}</div><div class="card"><h3>Prepare for your conversation</h3><p class="small">A short, practical checklist for consultation preparation.</p>${['Note the symptoms you want to discuss','Bring dates or a cycle summary if relevant','Write down your main questions','List medications or health details you choose to share'].map(t=>`<label class="list-row small" style="cursor:pointer"><input type="checkbox" class="check"> ${t}</label>`).join('')}<div class="form-actions">${linkbtn('Create a health report','reports')}</div></div></div></main>`}
function partner(){let lessons=[['🌸','Understanding menstruation','The basics of cycles, variation and respect.','periods'],['🤝','Support that actually helps','Practical kindness starts by asking what someone needs.','partner'],['💬','Breaking period myths','Fact-based answers without judgement.','myths'],['🛡️','Contraception basics','Learn the language of responsible reproductive care.','contraception'],['🌷','Recognising concerning pain','Not every painful experience should be normalised.','cramps'],['☀️','Menopause awareness','Understanding changing needs across life stages.','menopause']];let quizQ='What is a supportive response when someone says period pain is affecting their day?';return `<main class="container page-stack">${titleBlock('PARTNERS & FAMILIES','Support her better.','Understanding is the first step to meaningful support. You never need access to someone’s private health logs to learn.')}<div class="grid grid-3">${lessons.map(([e,t,d,k])=>`<div class="feature"><div class="feature-icon peach">${e}</div><h3>${t}</h3><p>${d}</p><button class="mini-link" data-action="article" data-id="${k}">Start learning ${ic('arrow')}</button></div>`).join('')}</div><div class="grid grid-2" style="margin-top:24px;align-items:start"><div class="card"><span class="eyebrow">INTERACTIVE LEARNING</span><h3>Mini quiz: how would you respond?</h3><p>${quizQ}</p><div class="quiz-options">${['Tell them to ignore it — everyone gets cramps.','Ask what support they need and encourage appropriate care if pain is severe or disruptive.','Assume they are exaggerating.'].map((q,i)=>`<button class="quiz-opt ${state.quizChoice===i?'selected':''} ${state.quizAnswered?(i===1?'correct':state.quizChoice===i?'wrong':''):''}" data-action="quiz" data-id="${i}">${q}</button>`).join('')}</div>${state.quizAnswered?`<div class="notice ${state.quizChoice===1?'green':'warm'}">${state.quizChoice===1?'Exactly. Listen without judgement and encourage appropriate care.':'A supportive response begins with listening and taking someone’s experience seriously.'}</div>`:button('Check my answer','primary','quiz-check')}</div><div class="focus-card"><div class="feature-icon">${ic('lock')}</div><h3>Respect first. Privacy always.</h3><p>Partners can use this entire learning hub without seeing a user's cycle, symptoms, mood or medical records.</p><p class="small">For sharing, send educational articles rather than private data. The site does not currently connect partner accounts.</p>${button('Copy learning link','outline','share-partner')}</div></div></main>`}

function community(){return `<main class="container page-stack">${titleBlock('THE CIRCLE','A space for understanding.','Read and share experiences in a judgment-free environment. Posts remain on this browser in demo mode.',button(ic('plus')+' Start discussion','primary','open-post'))}<div class="notice warm" style="margin-bottom:20px">Community posts are not medical advice. This offline demo is not connected to public users or a live moderation service. Do not share identifiable health details.</div><div class="tabs">${['All','Periods','Well-being','Menopause','Partner support'].map(t=>`<button class="tab ${ui.community===t?'active':''}" data-action="community-filter" data-value="${t}">${t}</button>`).join('')}</div><div class="grid grid-2" id="community-results">${communityCards()}</div></main>`}
function impact(){let causes=[...CAUSES,...(state.customCampaigns||[])];let donated=state.donations.reduce((a,b)=>a+b.amount,0);return `<main class="container page-stack">${titleBlock('MAKE AN IMPACT','Small steps. Wider access.',"Discover what a transparent, inclusive women’s healthcare funding platform could look like.")}<div class="notice warm" style="margin-bottom:20px"><strong>Simulation only:</strong> These campaigns, beneficiaries, amounts and donation progress are fictional. No payment is made, and no real NGO is affiliated with this prototype.</div><div class="stats-grid">${stat('Demo campaigns',causes.length,'Fictional examples')}${stat('Your demo contributions',state.donations.length,'Saved locally')}${stat('Your demo total',currency(donated),'No real funds transferred')}${stat('Impact goals','SDG 3 + 5','Health & gender equality')}</div><div class="grid grid-3">${causes.map(c=>{let raised=c.raised+state.donations.filter(x=>x.causeId===c.id).reduce((a,b)=>a+b.amount,0);let pc=Math.min(100,Math.round(raised/c.goal*100));return `<article class="card donation-card"><div class="donation-top">${c.emoji}</div><div class="eyebrow" style="margin:17px 0 7px">${esc(c.cat)}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="donation-meta"><strong>${currency(raised)} <span class="muted">raised</span></strong><span>${pc}%</span></div><div class="progress-bar"><span style="width:${pc}%"></span></div><p class="tiny" style="margin-top:10px">Goal: ${currency(c.goal)} · fictional campaign</p><button class="btn btn-primary btn-mini" style="margin-top:5px" data-action="donate" data-id="${c.id}">Try a demo contribution ${ic('arrow')}</button></article>`}).join('')}</div><div class="card" style="margin-top:25px"><h3>Why transparency matters</h3><div class="grid grid-3">${[['shield','Clearly labelled causes','Know the intended purpose of funding.'],['file','Accountable progress','See campaign status and supporting information.'],['heart','Access with dignity','Put privacy and beneficiaries first.']].map(([i,t,d])=>`<div><div class="feature-icon">${ic(i)}</div><h4>${t}</h4><p class="small">${d}</p></div>`).join('')}</div></div></main>`}
function reports(){let x=periodInfo(),rows=[...state.symptoms].sort((a,b)=>b.date.localeCompare(a.date));return `<main class="container page-stack">${titleBlock('PREPARE FOR YOUR CONSULTATION','My health summary','A clear record of the information you have logged. You decide what to export or share.',button(ic('download')+' Download HTML report','primary','export-report'))}<div class="grid grid-2"><div class="card"><div class="section-title-row"><h3>Report preview</h3><span class="tag green">Private demo</span></div><div class="row between"><div><strong style="font-size:20px">${esc(state.profile.name)}'s report</strong><p class="small">Prepared ${nice(dt(TODAY))}</p></div><div class="feature-icon" style="margin:0">${ic('file')}</div></div><div class="divider"></div><div class="grid grid-2"><div><div class="stat-label">Recorded cycles</div><strong>${state.periods.length}</strong></div><div><div class="stat-label">Average cycle</div><strong>${x.length?x.length+' days':'Insufficient history'}</strong></div><div><div class="stat-label">Symptoms logged</div><strong>${rows.length}</strong></div><div><div class="stat-label">Last period</div><strong>${nice(x.last)}</strong></div></div><div class="divider"></div><h4>Recent symptom records</h4>${rows.slice(0,6).map(s=>`<div class="list-row"><div class="small">${esc(s.name)} · ${esc(s.severity)}/10</div><small style="margin-left:auto">${nice(s.date)}</small></div>`).join('')||'<p class="small muted">No symptom records</p>'}</div><div class="stack"><div class="focus-card"><h3>Choose what to share</h3><p class="small">By default your downloaded report contains the same demo records shown here. Keep the file private and share it only when you choose to.</p><div class="form-actions">${button(ic('download')+' Download report','primary','export-report')}${button('Export CSV data','outline','export-csv')}</div></div><div class="card"><h3>For a productive appointment</h3><p class="small">Use your notes to help describe symptoms, duration, patterns and their impact on everyday activities.</p><div class="notice">User-entered data is unverified and should not be interpreted as a clinical diagnosis. You can open the HTML report and use your browser's Print → Save as PDF option.</div></div></div></div></main>`}
function settings(){return `<main class="container page-stack">${titleBlock('YOU ARE IN CONTROL','My space & privacy','Manage your demo profile, personal preferences and locally saved health information.')}<div class="grid grid-2"><form class="card" id="profile-form"><h3>Personalise your dashboard</h3><div class="stack"><label class="field">Display name<input class="input" name="name" required maxlength="40" value="${esc(state.profile.name)}"></label><label class="field">City<input class="input" name="city" maxlength="60" value="${esc(state.profile.city)}"></label><label class="field">Life stage<select class="select" name="stage">${['Menstrual / reproductive years','Perimenopause','Menopause','Post-menopause','General education / prefer not to say'].map(s=>`<option ${state.profile.stage===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Community pseudonym<input class="input" maxlength="30" name="pseudonym" value="${esc(state.privacy.communityPseudonym)}"></label><button type="submit" class="btn btn-primary">${ic('check')} Save changes</button></div></form><div class="stack"><div class="card"><div class="feature-icon green">${ic('shield')}</div><h3>Private by design — in this prototype</h3><p class="small">No server account has been created. Demo data is stored locally on this browser only. There is no real doctor, payment or partner integration.</p><div class="notice">Avoid entering actual sensitive medical information on a shared computer. Deleting browser storage or using the reset control removes local records.</div></div><div class="card"><h3>Manage your data</h3><div class="form-actions">${button('Export records','outline','export-csv')}${button('Reset demo data','soft','reset-demo')}${button('Delete all local data','outline','clear-data')}</div></div></div></div></main>`}
function about(){return `<main class="container page-stack">${titleBlock('OUR STORY','Built for the questions that deserve answers.','Standing Ovulation began as a Technology Innovation and Impact student concept to make menstrual and reproductive health easier to understand and navigate.')}<div class="grid grid-2" style="gap:26px"><div class="focus-card"><div class="eyebrow">THE PROBLEM</div><h2>Information exists. Clarity can be harder to find.</h2><p>People may move between period trackers, social media, search results, friends, family and healthcare professionals — without a clear connection between what they record, what they learn, and when to seek appropriate care.</p></div><div class="focus-card" style="background:#fff3ed;border-color:#f1e3dd"><div class="eyebrow">OUR RESPONSE</div><h2>Track. Understand. Verify. Recognise. Connect. Support.</h2><p>Our concept brings menstrual tracking, education, symptom awareness, professional discovery, partner learning and healthcare access campaigns into one coherent experience.</p></div></div><div class="section-small"><div class="section-head"><div class="eyebrow">IMPACT AT THE HEART</div><h2>Supporting global development goals</h2></div><div class="grid grid-2"><div class="card"><span class="tag green">SDG 3</span><h3 style="margin-top:14px">Good Health and Well-being</h3><p>Focused on reproductive-health information, awareness and better pathways to appropriate care, especially the goals reflected in Target 3.7.</p></div><div class="card"><span class="tag peach">SDG 5</span><h3 style="margin-top:14px">Gender Equality</h3><p>Promoting agency, stigma reduction, informed support and access to sexual and reproductive-health information, aligned with Target 5.6.</p></div></div></div><div class="card"><h3>The TII student team</h3><p class="small">Editable project-team credits. Roles below reflect the assignment-stage team setup, not a formally registered organisation.</p><div class="grid grid-4">${[['Jessica Wilfred Morris','Project manager'],['Sara Mandlecha','User advocate'],['Niyanhi Jain','Stakeholder mapper'],['Soha','Question designer / observer']].map(([n,r])=>`<div style="padding:14px;background:#faf6fc;border-radius:13px"><div class="avatar-round" style="margin-bottom:11px">${n[0]}</div><strong class="small">${n}</strong><p class="tiny" style="margin:4px 0">${r}</p></div>`).join('')}</div></div></main>`}
function more(){return `<main class="container page-stack">${titleBlock('EXPLORE EVERYTHING','More ways to use Standing Ovulation','All of the core features of our connected wellness experience.')}<div class="grid grid-3">${[['activity','Symptoms & journal','symptoms'],['search','Understand symptoms','understand'],['book','Education library','library'],['sun','Nutrition & lifestyle','nutrition'],['calendar','Appointments','appointments'],['users','Partner & family hub','partner'],['heart','Life-stage learning','life'],['message','The Circle community','community'],['hand','Fundraising demo','impact'],['file','Health report','reports'],['settings','Settings & privacy','settings'],['shield','Admin overview','admin'],['info','Our mission','about']].map(([i,t,r])=>`<a href="#/${r}" class="feature" style="min-height:135px"><div class="feature-icon">${ic(i)}</div><h3>${t} ${ic('arrow')}</h3></a>`).join('')}</div></main>`}
function admin(){let reported=state.posts.filter(x=>x.reported);return `<main class="container page-stack">${titleBlock('DEMONSTRATION ADMIN','Platform overview','Sample operational metrics from your local demo session. This is not a production administrator system.')}<div class="notice warm" style="margin-bottom:23px">This route is a visible classroom demo, not a secured admin portal. Never deploy real admin access without server authentication and role-based permissions.</div><div class="stats-grid">${stat('Educational articles',Object.keys(A).length,'Demo library')}${stat('Sample specialists',DOCS.length,'Fictional profiles')}${stat('Community posts',state.posts.length,'Local plus sample')}${stat('Reported posts',reported.length,'Local flags')}</div><div class="grid grid-2"><div class="card"><h3>Content checklist</h3>${[['Health education','Available'],['Specialist directory','Fictional demo only'],['Appointments','Simulated locally'],['Fundraising','Simulated locally'],['Medical review','Not conducted']].map(([n,s])=>`<div class="list-row"><span class="small">${n}</span><span class="pill" style="margin-left:auto">${s}</span></div>`).join('')}</div><div class="card"><h3>Community report queue</h3>${reported.length?reported.map(p=>`<div class="list-row"><div style="flex:1"><strong>${esc(p.title)}</strong><p>${esc(p.name)} · ${esc(p.category)}</p></div><button data-id="${p.id}" data-action="unreport" class="btn btn-outline btn-mini">Clear flag</button></div>`).join(''):'<p class="small muted">No reported posts in local demo data.</p>'}</div></div></main>`}

function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.cssText='position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#392844;color:white;padding:12px 19px;border-radius:12px;font-size:13px;z-index:200;box-shadow:0 12px 35px #1f14245c;max-width:90vw;text-align:center';clearTimeout(window._toastTime);window._toastTime=setTimeout(()=>el.textContent='',3500)}
function modal(title,html,wide=false){document.querySelector('#modal').innerHTML=`<div class="modal-overlay" data-action="close-overlay"><div class="modal-box ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="modal-close" data-action="close-modal" aria-label="Close dialog">${ic('close')}</button><h2>${title}</h2><div class="modal-body">${html}</div></div></div>`;document.body.style.overflow='hidden'}

function openPeriod(date=dt(TODAY)){modal('Log a period',`<p>Add the first and last day of a menstrual period. Both dates are saved privately in this browser.</p><form id="period-form"><div class="form-grid"><label class="field">Period start date<input class="input" type="date" name="start" value="${date}" required></label><label class="field">Period end date<input class="input" type="date" name="end" value="${date}" required></label></div><label class="field" style="margin-top:15px">Typical flow level (optional)<select class="select" name="flow"><option value="">Not recorded</option><option>Spotting</option><option>Light</option><option>Medium</option><option>Heavy</option><option>Very heavy</option></select></label><div class="form-actions"><button class="btn btn-primary" type="submit">Save period</button>${button('Cancel','outline','close-modal')}</div></form>`)}
function openSymptom(date=dt(TODAY)){modal('Log how you feel',`<p>Record one symptom and add details if you want. Intensity is self-reported, not a clinical score.</p><form id="symptom-form"><div class="form-grid"><label class="field">Date<input class="input" type="date" name="date" value="${date}" required></label><label class="field">Symptom<select name="name" class="select">${['Cramps','Pelvic pain','Headache','Bloating','Fatigue','Breast tenderness','Acne','Sleep changes','Heavy bleeding','Nausea','Mood changes','Hot flushes','Back pain','Other'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field">Intensity (1-10)<input class="input" name="severity" type="number" min="1" max="10" value="4" required></label><label class="field">Mood<select name="mood" class="select">${['Not recorded','Calm','Happy','Okay','Tired','Low energy','Irritable','Anxious','Sad'].map(t=>`<option>${t}</option>`).join('')}</select></label></div><label class="field" style="margin-top:15px">Optional notes<textarea name="notes" maxlength="500" class="textarea" placeholder="Anything you want to remember..."></textarea></label><div class="form-actions"><button class="btn btn-primary" type="submit">Save symptom</button>${button('Cancel','outline','close-modal')}</div></form>`)}
function openArticle(id){let a=A[id];if(!a)return;modal(`${a.emoji} ${esc(a.title)}`,`<span class="tag">${esc(a.cat)} · ${a.minutes} MIN READ</span><div class="article-body"><h4>Let's understand it</h4><p>${esc(a.intro)}</p><h4>What may help</h4><p>${esc(a.take)}</p><div class="notice warm">This is a concise educational demonstration, not personalised medical advice or a clinical diagnosis. Seek appropriate professional care if you are concerned.</div><h4>Further reading</h4><p><a href="${a.source}" target="_blank" rel="noopener noreferrer" class="link">Read the external health information source ${ic('arrow')}</a></p><div class="form-actions">${button(state.bookmarks.includes(id)?'♥ Remove bookmark':'♡ Save to my reading list','soft','bookmark',`data-id="${id}"`)}${linkbtn('Explore specialist categories','care','outline')}</div></div>`,true)}
function openDoctor(id){let d=DOCS.find(x=>x.id===Number(id));if(!d)return;modal(d.name,`<span class="tag peach">FICTIONAL DEMO PROFESSIONAL — NOT A REAL PROVIDER</span><div class="row" style="margin-top:18px"><div class="doctor-avatar">${d.initials}</div><div><h3 style="margin:0">${d.title}</h3><p class="small" style="margin:4px 0">${d.focus}</p><div class="small muted">${ic('pin')} ${d.area}, Mumbai · ${d.lang}</div></div></div><p style="margin-top:17px">Choose a sample appointment for the university demonstration. No medical professional will receive the booking.</p><form id="booking-form"><input type="hidden" name="id" value="${d.id}"><div class="form-grid"><label class="field">Consultation mode<select class="select" name="mode">${(d.mode==='Both'?['Online','In-person']:[d.mode]).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Demo date<input type="date" class="input" name="date" min="${dt(TODAY)}" value="${dt(plus(TODAY,2))}" required></label><label class="field">Sample appointment time<select class="select" name="time"><option>10:30 AM</option><option>12:00 PM</option><option>3:30 PM</option><option>5:00 PM</option></select></label><label class="field">Illustrative fee<input class="input" value="${currency(d.fees)} — demo only" disabled></label></div><label class="field" style="margin-top:15px">Optional reason (do not enter sensitive real data)<textarea class="textarea" maxlength="250" name="reason" placeholder="For example: questions about period pain"></textarea></label><div class="form-actions"><button class="btn btn-primary" type="submit">Confirm demo appointment</button>${button('Cancel','outline','close-modal')}</div></form>`,true)}
function openDonate(id){let c=[...CAUSES,...state.customCampaigns].find(x=>x.id===Number(id));if(!c)return;modal('Try a demo contribution',`<span class="tag peach">SIMULATED · NO MONEY WILL BE CHARGED</span><h3 style="margin-top:18px">${esc(c.title)}</h3><p>${esc(c.desc)}</p><form id="donate-form"><input type="hidden" name="id" value="${c.id}"><label class="field">Choose a sample amount <select class="select" name="amount"><option value="50">₹50</option><option value="100" selected>₹100</option><option value="250">₹250</option><option value="500">₹500</option></select></label><div class="form-actions"><button class="btn btn-primary" type="submit">Confirm demo contribution</button>${button('Cancel','outline','close-modal')}</div></form><div class="notice warm" style="margin-top:15px">All campaigns are fictional. This demonstrates how a future transparent funding interface could work.</div>`)}
function openPost(){modal('Start a discussion',`<p>Your post is stored only on your device. Avoid including identifying or private medical information.</p><form id="post-form"><div class="stack"><label class="field">Category<select class="select" name="category">${['Periods','Well-being','Menopause','Partner support'].map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field">Discussion title<input class="input" name="title" maxlength="100" required placeholder="What would you like to discuss?"></label><label class="field">Your message<textarea class="textarea" name="body" required maxlength="1500" placeholder="Share a respectful experience or question..."></textarea></label><button class="btn btn-primary" type="submit">Save local discussion</button></div></form>`)}
function createReport(){let p=[...state.periods].sort((a,b)=>a.start.localeCompare(b.start)),s=[...state.symptoms].sort((a,b)=>a.date.localeCompare(b.date)),x=periodInfo();return `<!doctype html><html><head><meta charset="utf-8"><title>Standing Ovulation - Health Summary</title><style>body{font:15px/1.6 Arial,sans-serif;color:#45334e;max-width:820px;margin:45px auto;padding:0 25px}h1{color:#5d3b70}h2{border-bottom:1px solid #e5dce7;padding-bottom:9px}p,small{color:#685d6f}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eae2ee}th{background:#f6eff7}.box{background:#f7f0f9;padding:15px;border-radius:10px}.footer{font-size:12px;padding:20px 0}@media print{button{display:none}}</style></head><body><small>STANDING OVULATION · PERSONAL HEALTH SUMMARY · OFFLINE DEMO</small><h1>${esc(state.profile.name)}'s health report</h1><p>Created ${nice(dt(TODAY))}. All values come from locally stored, user-entered data.</p><div class="box"><strong>Summary</strong><p>Logged cycles: ${p.length} | Average observed cycle length: ${x.length||'Not enough entries'} days | Average period duration: ${x.duration||'—'} days | Symptoms logged: ${s.length}</p></div><h2>Cycle history</h2><table><tr><th>First day</th><th>Last day</th><th>Duration</th><th>Typical flow</th></tr>${p.map(x=>`<tr><td>${nice(x.start)}</td><td>${nice(x.end)}</td><td>${diff(x.end,x.start)+1} days</td><td>${esc(x.flow||'Not recorded')}</td></tr>`).join('')}</table><h2>Symptom log</h2><table><tr><th>Date</th><th>Symptom</th><th>Intensity</th><th>Notes</th></tr>${s.map(x=>`<tr><td>${nice(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.severity)}/10</td><td>${esc(x.notes)}</td></tr>`).join('')}</table><p class="footer">This report contains unverified self-reported information. It is not medical advice or a diagnosis. Predictions are uncertain and not reliable contraception. Share this report only with someone you choose.</p><button onclick="window.print()">Print / Save as PDF</button></body></html>`}
function download(name,contents,type){let blob=new Blob([contents],{type});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

case'bookmark':{state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];persist();if(document.querySelector('#modal').innerHTML){openArticle(id)}else rerender();toast('Reading list updated');break}
case'article':openArticle(id);break;
case'delete-period':if(confirm('Delete this period entry from local data?')){state.periods=state.periods.filter(x=>x.id!==Number(id));persist();rerender();toast('Period entry deleted')}break;
case'delete-symptom':if(confirm('Delete this symptom log?')){state.symptoms=state.symptoms.filter(x=>x.id!==Number(id));persist();rerender();toast('Symptom entry deleted')}break;
case'doctor':openDoctor(id);break;
case'save-doctor':{let n=Number(id);state.savedDoctors=state.savedDoctors.includes(n)?state.savedDoctors.filter(x=>x!==n):[...state.savedDoctors,n];persist();rerender();toast('Saved specialists updated');break}
case'cancel-appointment':{let x=state.appointments.find(x=>x.id===Number(id));if(x){x.status='Cancelled';persist();rerender();toast('Demo appointment cancelled')}break}
case'quiz':state.quizChoice=Number(id);state.quizAnswered=false;persist();rerender();break;
case'quiz-check':if(state.quizChoice===null){toast('Choose an answer first');break}state.quizAnswered=true;persist();rerender();break;
case'share-partner':{let msg='Learn how to support someone with respectful, evidence-aware menstrual health education: '+location.href.split('#')[0]+'#/partner';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>toast('Learning link copied')).catch(()=>prompt('Copy this link:',msg))}else prompt('Copy this link:',msg);break}
case'community-filter':ui.community=b.dataset.value;rerender();break;
case'delete-post':if(confirm('Delete this local discussion?')){state.posts=state.posts.filter(p=>p.id!==Number(id));persist();rerender();toast('Local discussion deleted')}break;
case'report-post':{let p=state.posts.find(p=>p.id===Number(id));if(p){p.reported=true;persist();rerender();toast('Flag saved in local moderation queue')}break}
case'unreport':{let p=state.posts.find(p=>p.id===Number(id));if(p){p.reported=false;persist();rerender();toast('Flag cleared')}break}
case'donate':openDonate(id);break;
case'export-report':download('Standing_Ovulation_Health_Report.html',createReport(),'text/html');toast('Report downloaded — open it and print to PDF');break;
case'export-csv':download('Standing_Ovulation_Health_Data.csv',exportCsv(),'text/csv');toast('CSV data downloaded');break;
case'reset-demo':if(confirm('Restore the initial fictional demonstration data? This will overwrite your current local entries.')){state=seed();persist();rerender();toast('Initial demo restored')}break;
case'clear-data':if(confirm('Permanently delete all information saved locally in this browser for Standing Ovulation?')){state=seed();state.periods=[];state.symptoms=[];state.posts=[];state.donations=[];state.appointments=[];state.bookmarks=[];state.savedDoctors=[];state.profile.name='Guest';persist();rerender();toast('Your local records were cleared')}break;
}});
document.addEventListener('submit',e=>{let f=e.target;let formId=f.getAttribute('id');if(!['period-form','symptom-form','booking-form','donate-form','post-form','profile-form'].includes(formId))return;e.preventDefault();let d=Object.fromEntries(new FormData(f));
if(formId==='period-form'){if(d.end<d.start||diff(d.end,d.start)>15){toast('Please enter a valid period duration (1–16 days).');return}state.periods.push({id:Date.now(),start:d.start,end:d.end,flow:d.flow||''});state.periods.sort((a,b)=>a.start.localeCompare(b.start));toast('Your period has been logged')}
if(formId==='symptom-form'){state.symptoms.push({id:Date.now(),date:d.date,name:d.name,severity:Number(d.severity),mood:d.mood==='Not recorded'?'':d.mood,notes:d.notes||''});toast('Your symptom has been logged')}
if(formId==='booking-form'){let doc=DOCS.find(x=>x.id===Number(d.id));if(!doc)return;state.appointments.push({id:Date.now(),name:doc.name,date:d.date,time:d.time,mode:d.mode,reason:d.reason||'',status:'Demo confirmed'});toast('Demo booking saved — no real appointment made')}
if(formId==='donate-form'){state.donations.push({id:Date.now(),causeId:Number(d.id),amount:Number(d.amount),date:dt(TODAY)});toast('Demo contribution added — no money transferred')}
if(formId==='post-form'){state.posts.push({id:Date.now(),name:state.privacy.communityPseudonym||'Anonymous',title:d.title.trim(),body:d.body.trim(),category:d.category,date:dt(TODAY),demo:false,reported:false});toast('Your local discussion is saved')}
if(formId==='profile-form'){state.profile.name=d.name.trim().slice(0,40)||'Guest';state.profile.city=d.city.trim().slice(0,60)||'Mumbai';state.profile.stage=d.stage;state.privacy.communityPseudonym=d.pseudonym.trim().slice(0,30)||'Anonymous';toast('Your demo preferences are saved')}
persist();closeModal();rerender();});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){ui.search=e.target.value;let out=document.querySelector('#library-results');if(out)out.innerHTML=libraryCards()}if(e.target.id==='care-search'){ui.careSearch=e.target.value;let out=document.querySelector('#care-results');if(out)out.innerHTML=careCards()}});
document.addEventListener('change',e=>{if(e.target.id==='library-category'){ui.filter=e.target.value;document.querySelector('#library-results').innerHTML=libraryCards()}if(e.target.id==='care-category'){ui.care=e.target.value;document.querySelector('#care-results').innerHTML=careCards()}if(e.target.id==='care-sort'){ui.sort=e.target.value;document.querySelector('#care-results').innerHTML=careCards()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();

</script>
</body>
</html>
